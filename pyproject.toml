[project]
name = "fincopilot"
version = "0.0.1"
description = "Privacy-first, fully offline personal finance intelligence with on-device ML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Muntasirul Munna" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1",
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0",
    "numpy>=1.26,<3.0",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4.0",
    "sqlglot>=25.0",
    "scikit-learn>=1.5,<2.0",
    "onnxruntime>=1.18",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "transformers>=4.43",
    "datasets>=2.20",
    "lightgbm>=4.4",
    "mlflow>=2.14",
    "onnx>=1.16",
    "optimum[onnxruntime]>=1.21",
    "peft>=0.12",
    "statsmodels>=0.14",
]
datagen = [
    "reportlab>=4.2",
    "faker>=26.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
    "kaggle>=1.6",
    "jupyter>=1.0",
]

[project.scripts]
fincopilot = "fincopilot.main:cli"

[project.entry-points."fincopilot.parsers"]
generic_csv = "fincopilot.ingestion.parsers.generic_csv:GenericCSVParser"
generic_pdf = "fincopilot.ingestion.parsers.generic_pdf:GenericPDFParser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincopilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "datagen", "scripts"]
extend-exclude = ["notebooks", "kaggle_dataset", "apps/desktop/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/fincopilot/api/*.py" = ["B008"]  # FastAPI idiom: Depends()/File() in defaults

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["fincopilot"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fincopilot --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/fincopilot"]
omit = ["src/fincopilot/ml/*/train*.py", "src/fincopilot/ml/*/finetune*.py"]
