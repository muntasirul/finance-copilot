# Persona profiles. Amounts are in the persona's currency per month unless noted.
# spend_monthly = expected debit total; the generator samples daily spend to hit it.

salaried:
  count: 4                       # number of accounts generated with this profile
  income: {amount: 4200, day_of_month: 28, jitter_days: 1, subcategory: salary, merchant: "ACME PAYROLL"}
  rent: {amount: 1400, day_of_month: 3, subcategory: rent}
  subscriptions: [netflix, spotify, icloud, gym_membership]
  spend_monthly: [2200, 3200]    # uniform range
  daily_spend_mu: 65             # lognormal params for a debit transaction
  daily_spend_sigma: 0.85
  txn_per_month: [70, 110]
  utilities: {utilities_electric: 120, internet: 60, phone: 45}

